name: A link planted at the fixed manifest temp-file name older releases used is never written through
# .qa-skills-manifest sits at the project root and is committed, so a repository a user clones
# can also carry a symlink named .qa-skills-manifest.tmp, the temp file every manifest write once
# went through. No installer writes to that fixed name any more: each creates a randomly named
# temp file exclusively and renames it into place. This case therefore proves only that the old
# fixed name stays unused, and it would catch a return to it. It cannot catch an installer that
# opens its random name without exclusive create, since the runner cannot plant a link at a name
# chosen at run time. What does test exclusive create: lifecycle Tests 49 and 52 for install.sh's
# write_exclusive, which writes its backups, link-target files and manifest temp file, and Test 49
# for the CLI's backups ("wx"). The CLI's manifest temp file ("wx" too) and install.ps1 (CreateNew)
# have no such test; Test 46b's mktemp stand-in is never called, since install.sh stopped using
# mktemp for the manifest (plan 033, plan 045 item 3).
# Note, 2026-10-19 (plan 053 I9, I10): Test 46b now plants its link at install.sh's real temp
# name, Test 66 does the same for the CLI's manifest temp file, and tests/test-lifecycle.ps1 Test
# 52 covers install.ps1's backups, .link-target files and manifest temp file, and the CLI's
# backups on Windows.
seed: home:victim.txt = VICTIM CONTENT
seed-symlink: project:.qa-skills-manifest.tmp -> home:victim.txt
run: install project claude
run: uninstall project claude
expect-exit: 0
expect-content: home:victim.txt = VICTIM CONTENT
