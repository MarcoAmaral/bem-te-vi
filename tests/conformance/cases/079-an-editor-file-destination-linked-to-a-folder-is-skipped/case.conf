name: Another editor's file destination that is a link to a folder is skipped as a directory
# Case 078 for an editor other than Claude Code: .github/copilot-instructions.md is a symlink to a
# folder of the user's. Nothing is written into it, backed up, replaced or recorded, and Copilot's
# skills still install (plan 061 B2).
seed: home:my-copilot/01-mine.md = MY OWN COPILOT NOTES
seed-dir: project:.github
seed-symlink: project:.github/copilot-instructions.md -> home:my-copilot
run: install project copilot
expect-exit: 0
expect-content: home:my-copilot/01-mine.md = MY OWN COPILOT NOTES
expect-content: project:.github/copilot-instructions.md/01-mine.md = MY OWN COPILOT NOTES
expect-no-backup: project:.github/copilot-instructions.md
expect-no-manifest: project copilot .github/copilot-instructions.md
expect-manifest: project copilot .github/skills/qa/SKILL.md
expect-output: is a directory
