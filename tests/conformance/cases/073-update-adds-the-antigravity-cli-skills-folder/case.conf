name: Update of a global Antigravity install made before plan 058 adds the Antigravity CLI's skills folder
# The install recorded only ~/.gemini/config/skills. Update installs every file the package now
# writes for antigravity globally, so the CLI folder arrives too, and reports it as added.
seed-package: home:.gemini/config/skills/qa/SKILL.md = adapters/skills/qa/SKILL.md
seed-manifest: home antigravity .gemini/config/skills/qa/SKILL.md
seed-package: home:.gemini/config/skills/qa-cases/SKILL.md = adapters/skills/qa-cases/SKILL.md
seed-manifest: home antigravity .gemini/config/skills/qa-cases/SKILL.md
run: update global antigravity
expect-exit: 0
expect-tree-as-package: home:.gemini/config/skills = adapters/skills
expect-tree-as-package: home:.gemini/antigravity-cli/skills = adapters/skills
expect-manifest: home antigravity .gemini/antigravity-cli/skills/qa/SKILL.md
expect-output: Added
