name: A linked folder whose target is missing is skipped like any linked folder; the rest installs
# .claude/rules is a link to a folder that does not exist (a dotfiles checkout not cloned yet, say).
# Creating the folder would create it through the link, outside the install tree; failing on it
# would abort the whole install. The installer must skip it, say so, and install everything else.
# CLAUDE.md only creates the .claude folder the link is placed in.
seed: project:.claude/CLAUDE.md = THE PROJECT'S OWN NOTES
seed-symlink: project:.claude/rules -> home:not-cloned-yet
run: install project claude
expect-exit: 0
expect-absent: home:not-cloned-yet
expect-file: project:.claude/commands/qa.md
expect-manifest: project claude .claude/commands/qa.md
expect-output: symbolic link
