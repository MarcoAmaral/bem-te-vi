name: The hint after a Claude Code install names every command, skill and agent the package ships
# The lists are read from the package at run time, so adding a command updates the hint with no
# edit; a hand-written list drifts. The hint never points at a file the package does not ship.
run: install project claude
expect-exit: 0
expect-output-lists-package: .claude/commands qa-*.md
expect-output-lists-package: .claude/skills */
expect-output-lists-package: .claude/agents *.md
expect-no-output: INSTALL.md
