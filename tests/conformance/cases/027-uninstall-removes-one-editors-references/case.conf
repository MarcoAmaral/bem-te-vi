name: Uninstalling one editor removes its references and spares another editor's
# Each editor has its own skills folder (plan 047), so uninstalling one never deletes a reference
# another editor reads.
run: install project windsurf
run: install project cline
run: uninstall project windsurf
expect-exit: 0
expect-absent: project:.windsurf
expect-no-manifest: project windsurf .windsurf/skills/qa-reference/references/testing-design.md
expect-same-as-package: project:.cline/skills/qa-reference/references/testing-design.md = .claude/skills/qa-reference/references/testing-design.md
expect-manifest: project cline .cline/skills/qa-reference/references/testing-design.md
