name: Update moves an old global install to the native layout and removes only the folders it emptied
# The merged adapter at each old global path, as 4.0.1 installed it, each recorded. Update removes
# them, installs the skills tree in each editor's documented global skills folder, and removes the
# folders it emptied (~/.windsurf, ~/.cursor/rules), but keeps ~/.gemini/antigravity, which holds a
# file of Antigravity's own.
seed: home:.cursor/rules/qa.mdc = OLD CURSOR ADAPTER
seed-manifest: home cursor .cursor/rules/qa.mdc
seed: home:.windsurf/rules/qa.md = OLD WINDSURF ADAPTER
seed-manifest: home windsurf .windsurf/rules/qa.md
seed: home:.gemini/antigravity/skills/qa/SKILL.md = OLD ANTIGRAVITY ADAPTER
seed-manifest: home antigravity .gemini/antigravity/skills/qa/SKILL.md
seed: home:.gemini/antigravity/settings.json = ANTIGRAVITY OWN SETTINGS
run: update global all
expect-exit: 0
expect-absent: home:.cursor/rules
expect-absent: home:.windsurf
expect-absent: home:.gemini/antigravity/skills
expect-content: home:.gemini/antigravity/settings.json = ANTIGRAVITY OWN SETTINGS
expect-no-manifest: home cursor .cursor/rules/qa.mdc
expect-no-manifest: home windsurf .windsurf/rules/qa.md
expect-no-manifest: home antigravity .gemini/antigravity/skills/qa/SKILL.md
expect-tree-as-package: home:.cursor/skills = adapters/skills
expect-tree-as-package: home:.codeium/windsurf/skills = adapters/skills
expect-tree-as-package: home:.gemini/config/skills = adapters/skills
expect-manifest: home antigravity .gemini/config/skills/qa/SKILL.md
expect-output: no longer shipped
