name: A symlinked destination is replaced by the package's file, never written through
# The link points at a file outside the install tree. Writing through it would overwrite that
# file; the installer must back its content up, replace the link itself, and leave the file alone.
# my-notes.md only creates the .claude/rules directory the link is placed in.
# The backup holds the content the link pointed at, and <backup>.link-target records the target.
seed: project:.claude/rules/my-notes.md = THE USER'S OWN RULE
seed: home:policy.md = NOTES OUTSIDE THE INSTALL TREE
seed-symlink: project:.claude/rules/security-qa.md -> home:policy.md
run: install project claude
expect-exit: 0
expect-content: home:policy.md = NOTES OUTSIDE THE INSTALL TREE
expect-same-as-package: project:.claude/rules/security-qa.md = .claude/rules/security-qa.md
expect-backup: project:.claude/rules/security-qa.md
expect-manifest: project claude .claude/rules/security-qa.md
expect-backup-content: project:.claude/rules/security-qa.md = NOTES OUTSIDE THE INSTALL TREE
expect-backup-link-target: project:.claude/rules/security-qa.md = home:policy.md
