name: Uninstalling the last non-Claude editor leaves no empty reference folder behind
# The folders an install created (the skills folder, each skill and its references) are removed
# once emptied, up to the project root (plan 047).
run: install project copilot
run: uninstall project copilot
expect-exit: 0
expect-absent: project:.github
expect-absent: project:.bem-te-vi
expect-no-manifest: project copilot .github/skills/qa-reference/references/testing-design.md
