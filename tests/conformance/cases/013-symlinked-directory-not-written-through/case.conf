name: A symlinked folder below the editor's folder is never written through; the rest installs
# .claude/rules is a link to a folder outside the install tree. Writing through it would replace
# the user's own file there and drop the package's files into a folder the installer does not own.
# The installer must skip every file under the link, say so, and install everything else.
# CLAUDE.md only creates the .claude folder the link is placed in.
seed: project:.claude/CLAUDE.md = THE PROJECT'S OWN NOTES
seed: home:outside/security-qa.md = MY OWN OUTSIDE RULE
seed-symlink: project:.claude/rules -> home:outside
run: install project claude
expect-exit: 0
expect-content: home:outside/security-qa.md = MY OWN OUTSIDE RULE
expect-absent: home:outside/testing-guidelines.md
expect-no-backup: home:outside/security-qa.md
expect-no-manifest: project claude .claude/rules/security-qa.md
expect-file: project:.claude/commands/qa.md
expect-manifest: project claude .claude/commands/qa.md
expect-output: symbolic link
