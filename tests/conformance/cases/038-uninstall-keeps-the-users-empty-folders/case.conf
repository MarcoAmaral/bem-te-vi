name: Uninstall removes the folders the package emptied, never the user's own empty folders
# .claude holds more than this package: Claude Code keeps its own folders there (projects/), and a
# user may keep empty folders of their own (my-notes/drafts/). Uninstall removes the package's
# files, then only the five folders it installs into (and the emptied folders under skills/), never
# another empty folder it happens to find under .claude.
seed-dir: project:.claude/my-notes/drafts
seed-dir: project:.claude/projects
run: install project claude
run: uninstall project claude
expect-exit: 0
expect-absent: project:.claude/rules
expect-absent: project:.claude/skills
expect-file: project:.claude/my-notes/drafts
expect-file: project:.claude/projects
