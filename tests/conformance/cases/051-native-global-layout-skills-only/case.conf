name: A global install of Cursor, Windsurf and Antigravity writes only skills, in each editor's documented global skills folder
# Plan 047. None of the three has a global rules file the package may write (Cursor's user rules
# live in its settings; Windsurf's global_rules.md and Antigravity's GEMINI.md are single files the
# user owns), so a global install is the skills tree alone. The old global paths are not written.
run: install global cursor
run: install global windsurf
run: install global antigravity
expect-exit: 0
expect-tree-as-package: home:.cursor/skills = adapters/skills
expect-tree-as-package: home:.codeium/windsurf/skills = adapters/skills
expect-tree-as-package: home:.gemini/config/skills = adapters/skills
expect-manifest: home cursor .cursor/skills/qa/SKILL.md
expect-manifest: home windsurf .codeium/windsurf/skills/qa-rules/SKILL.md
expect-manifest: home antigravity .gemini/config/skills/qa-reference/references/written-records.md
expect-absent: home:.cursor/rules
expect-absent: home:.windsurf
expect-absent: home:.gemini/antigravity
expect-absent: home:.codeium/windsurf/memories
expect-absent: home:.bem-te-vi
