name: A global install of GitHub Copilot writes the skills tree in ~/.copilot/skills and no rules file
# Plan 058. GitHub documents personal skills in "~/.copilot/skills or ~/.agents/skills"; the
# package uses Copilot's own folder, as it uses .github/skills and not .agents/skills per project.
# ~/.copilot/copilot-instructions.md is read by Copilot CLI and VS Code's Copilot harness only, not
# by every Copilot surface, and is one file the user owns, so no rules file is written.
run: install global copilot
expect-exit: 0
expect-tree-as-package: home:.copilot/skills = adapters/skills
expect-manifest: home copilot .copilot/skills/qa/SKILL.md
expect-manifest: home copilot .copilot/skills/qa-reference/references/written-records.md
expect-absent: home:.copilot/copilot-instructions.md
expect-absent: home:.copilot/instructions
expect-absent: home:.github
expect-absent: home:.agents
expect-no-output: only supports project-level install
