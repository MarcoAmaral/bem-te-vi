name: Update removes an unchanged manifest path with a space that it no longer ships, and keeps a changed one, each by its whole path
# The update counterpart of case 065: both recorded files are ones the package does not ship. The
# unchanged one is removed and reported, the changed one kept and reported, each by its whole path,
# and both entries dropped. Plan 053 I11.
run: install project cursor
seed: project:.cursor/rules/my notes.mdc = NOTES AN OLDER RELEASE INSTALLED
seed-manifest: project cursor .cursor/rules/my notes.mdc
seed: project:.cursor/rules/old  rules.mdc = RULES AN OLDER RELEASE INSTALLED
seed-manifest: project cursor .cursor/rules/old  rules.mdc
seed: project:.cursor/rules/old  rules.mdc = EDITED BY THE USER
run: update project cursor
expect-exit: 0
expect-absent: project:.cursor/rules/my notes.mdc
expect-content: project:.cursor/rules/old  rules.mdc = EDITED BY THE USER
expect-output: Removed .cursor/rules/my notes.mdc (no longer shipped)
expect-output: Kept .cursor/rules/old  rules.mdc
expect-no-manifest: project cursor .cursor/rules/my notes.mdc
expect-no-manifest: project cursor .cursor/rules/old  rules.mdc
expect-manifest: project cursor .cursor/skills/qa/SKILL.md
