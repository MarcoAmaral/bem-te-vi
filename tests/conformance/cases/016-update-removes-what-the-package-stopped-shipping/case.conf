name: Update removes a file the package stopped shipping when it is unchanged, and drops its entry
# retired-rule.md stands for a file an earlier release installed and this one no longer ships.
# It is still exactly as installed, so update removes it and forgets it.
run: install project claude
seed: project:.claude/rules/retired-rule.md = RETIRED RULE
seed-manifest: project claude .claude/rules/retired-rule.md
run: update project claude
expect-exit: 0
expect-absent: project:.claude/rules/retired-rule.md
expect-no-manifest: project claude .claude/rules/retired-rule.md
expect-manifest: project claude .claude/commands/qa.md
expect-output: no longer shipped
