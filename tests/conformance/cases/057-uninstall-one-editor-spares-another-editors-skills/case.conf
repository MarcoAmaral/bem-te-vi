name: Uninstalling one editor spares another editor's rules and skills, in both directions
# Each editor has its own skills folder (plan 047, D7), so uninstalling Cursor never removes the
# skills Antigravity reads, and the reverse. Project: Cursor goes. Home: Antigravity goes.
run: install project cursor
run: install project antigravity
run: uninstall project cursor
run: install global cursor
run: install global antigravity
run: uninstall global antigravity
expect-exit: 0
expect-absent: project:.cursor
expect-no-manifest: project cursor .cursor/skills/qa/SKILL.md
expect-tree-as-package: project:.agents/rules = adapters/antigravity/rules
expect-tree-as-package: project:.agents/skills = adapters/skills
expect-manifest: project antigravity .agents/skills/qa/SKILL.md
expect-absent: home:.gemini
expect-no-manifest: home antigravity .gemini/config/skills/qa/SKILL.md
expect-tree-as-package: home:.cursor/skills = adapters/skills
expect-manifest: home cursor .cursor/skills/qa/SKILL.md
