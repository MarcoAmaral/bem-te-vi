name: Update installs a skill reference that a non-Claude install predates
# Dropping one reference and its entry leaves an install made before the package shipped it.
# Update must install it in the editor's skills folder, as it installs any file the package
# started shipping.
run: install project cursor
drop-manifest: project cursor .cursor/skills/qa-reference/references/test-tools.md
run: update project cursor
expect-exit: 0
expect-same-as-package: project:.cursor/skills/qa-reference/references/test-tools.md = .claude/skills/qa-reference/references/test-tools.md
expect-manifest: project cursor .cursor/skills/qa-reference/references/test-tools.md
expect-output: Added
