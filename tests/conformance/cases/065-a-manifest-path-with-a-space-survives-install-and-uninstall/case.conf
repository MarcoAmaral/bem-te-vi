name: A manifest path with a space is kept whole when the manifest is rewritten, and uninstall acts on the whole path
# No path the package installs has a space today, but the manifest is a shared format (plan 010
# item 2) and an editor folder may hold one. Installing another editor rewrites the manifest: both
# entries must survive whole, hashes included, so uninstall removes the unchanged file and keeps
# the changed one, naming it by its whole path. The second path has two spaces in a row, which an
# installer that splits the line on spaces and joins it again would turn into one. A space in the
# project folder's own name (project [1]) is in every case. Plan 053 I11.
run: install project cursor
seed: project:.cursor/rules/my notes.mdc = NOTES THE PACKAGE INSTALLED
seed-manifest: project cursor .cursor/rules/my notes.mdc
seed: project:.cursor/rules/old  rules.mdc = RULES THE PACKAGE INSTALLED
seed-manifest: project cursor .cursor/rules/old  rules.mdc
seed: project:.cursor/rules/old  rules.mdc = EDITED BY THE USER
run: install project windsurf
run: uninstall project cursor
expect-exit: 0
expect-absent: project:.cursor/rules/my notes.mdc
expect-content: project:.cursor/rules/old  rules.mdc = EDITED BY THE USER
expect-output: Kept .cursor/rules/old  rules.mdc
expect-no-manifest: project cursor .cursor/rules/my notes.mdc
expect-no-manifest: project cursor .cursor/rules/old  rules.mdc
expect-manifest: project windsurf .windsurf/skills/qa/SKILL.md
