name: A user's own skill at a path the package installs is backed up, not overwritten, and the backup survives uninstall
# .agents/skills/qa/SKILL.md (Antigravity) and .cursor/skills/qa-cases/SKILL.md are names the
# package now installs. A user's own file there is backed up before the package's is written,
# and uninstall, which removes the package's file, never removes a backup.
seed: project:.agents/skills/qa/SKILL.md = MY OWN QA SKILL
seed: project:.cursor/skills/qa-cases/SKILL.md = MY OWN QA-CASES SKILL
run: install project antigravity
run: install project cursor
run: uninstall project antigravity
run: uninstall project cursor
expect-exit: 0
expect-backup-content: project:.agents/skills/qa/SKILL.md = MY OWN QA SKILL
expect-backup-content: project:.cursor/skills/qa-cases/SKILL.md = MY OWN QA-CASES SKILL
expect-absent: project:.agents/skills/qa/SKILL.md
expect-absent: project:.cursor/skills/qa-cases/SKILL.md
expect-absent: project:.agents/rules
