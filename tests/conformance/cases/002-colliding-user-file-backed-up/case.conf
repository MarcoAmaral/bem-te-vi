name: A user's own file at a package path is backed up, never destroyed
seed: project:.claude/rules/security-qa.md = MY OWN SECURITY RULES
run: install project claude
expect-exit: 0
expect-backup: project:.claude/rules/security-qa.md
expect-backup-content: project:.claude/rules/security-qa.md = MY OWN SECURITY RULES
expect-same-as-package: project:.claude/rules/security-qa.md = .claude/rules/security-qa.md
expect-manifest: project claude .claude/rules/security-qa.md
