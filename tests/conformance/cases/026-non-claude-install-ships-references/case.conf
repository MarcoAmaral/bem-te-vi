name: A non-Claude install ships the skill references inside its own skills folder
# Plan 043 installed the qa-reference files under .bem-te-vi/<editor>/; plan 047 installs them
# where the Agent Skills format puts them, in the qa-reference skill's references folder of the
# editor's skills folder. They are installed and recorded like any other file, and an editor with
# no global location gets none on a global install.
run: install project cursor
run: install global antigravity
run: install global copilot
expect-exit: 0
expect-file: project:.cursor/skills/qa-reference/SKILL.md
expect-same-as-package: project:.cursor/skills/qa-reference/references/testing-design.md = .claude/skills/qa-reference/references/testing-design.md
expect-same-as-package: project:.cursor/skills/qa-reference/references/written-records.md = .claude/skills/qa-reference/references/written-records.md
expect-manifest: project cursor .cursor/skills/qa-reference/references/testing-design.md
expect-same-as-package: home:.gemini/config/skills/qa-reference/references/testing-design.md = .claude/skills/qa-reference/references/testing-design.md
expect-manifest: home antigravity .gemini/config/skills/qa-reference/references/testing-design.md
expect-absent: home:.github
expect-absent: project:.bem-te-vi
expect-absent: home:.bem-te-vi
