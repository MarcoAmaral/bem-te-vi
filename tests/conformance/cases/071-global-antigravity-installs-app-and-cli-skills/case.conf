name: A global install of Antigravity writes the skills tree for the App and IDE and for the Antigravity CLI
# Plan 058. Antigravity documents global skills in ~/.gemini/config/skills/ for the App and the IDE
# and in ~/.gemini/antigravity-cli/skills/ for the CLI. Both are written and recorded under
# antigravity; no rules file (~/.gemini/GEMINI.md, ~/.gemini/AGENTS.md) is written.
run: install global antigravity
expect-exit: 0
expect-tree-as-package: home:.gemini/config/skills = adapters/skills
expect-tree-as-package: home:.gemini/antigravity-cli/skills = adapters/skills
expect-manifest: home antigravity .gemini/config/skills/qa/SKILL.md
expect-manifest: home antigravity .gemini/antigravity-cli/skills/qa/SKILL.md
expect-manifest: home antigravity .gemini/antigravity-cli/skills/qa-reference/references/written-records.md
expect-absent: home:.gemini/GEMINI.md
expect-absent: home:.gemini/AGENTS.md
expect-absent: home:.gemini/antigravity
