name: An update that names no editor refreshes every editor the manifest records, and installs no other
# The CLI's update with no --editor refreshes every editor its manifest records; install.sh's
# --update and install.ps1's -Update with no editor refreshed Claude Code only, so a project with
# no Claude Code install said "Nothing installed" (plan 061 B1). Cursor and Windsurf are installed,
# one file of each goes missing from the folder and the manifest, and an update with no editor
# must bring both back and still install nothing for Claude Code.
run: install project cursor
run: install project windsurf
drop-manifest: project cursor .cursor/skills/qa/SKILL.md
drop-manifest: project windsurf .windsurf/skills/qa/SKILL.md
run: update project
expect-exit: 0
expect-file: project:.cursor/skills/qa/SKILL.md
expect-file: project:.windsurf/skills/qa/SKILL.md
expect-manifest: project cursor .cursor/skills/qa/SKILL.md
expect-manifest: project windsurf .windsurf/skills/qa/SKILL.md
expect-absent: project:.claude
expect-no-output: Nothing installed
