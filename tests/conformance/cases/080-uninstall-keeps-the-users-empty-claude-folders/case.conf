name: A Claude Code uninstall removes only the folders its own removals emptied
# Plan 047's rule for the other editors (case 060), now for Claude Code too (plan 061 L1): a
# folder goes only when removing one of the package's files left it empty, and the package's own
# folders only when this run removed a Claude Code file. Project: Claude Code was never installed,
# and an uninstall of every editor keeps the user's empty .claude folders. Home: Claude Code is
# installed and uninstalled, and the user's own empty skill folder survives it.
seed-dir: project:.claude/skills/my-wip
seed-dir: project:.claude/agents
seed-dir: project:.claude/hooks
seed-dir: home:.claude/skills/my-wip
run: install project cursor
run: uninstall project all
run: install global claude
run: uninstall global claude
expect-exit: 0
expect-file: project:.claude/skills/my-wip
expect-file: project:.claude/agents
expect-file: project:.claude/hooks
expect-absent: project:.cursor
expect-file: home:.claude/skills/my-wip
expect-absent: home:.claude/rules
expect-absent: home:.claude/commands
expect-absent: home:.claude/skills/qa-plan
