name: Update keeps a file the package stopped shipping when it changed, and drops its entry
# As 016, but the file was edited after it was installed: it is the user's now. Update leaves it,
# says so, and stops recording it.
run: install project claude
seed: project:.claude/rules/retired-rule.md = RETIRED RULE
seed-manifest: project claude .claude/rules/retired-rule.md
seed: project:.claude/rules/retired-rule.md = RETIRED RULE, EDITED BY ME
run: update project claude
expect-exit: 0
expect-content: project:.claude/rules/retired-rule.md = RETIRED RULE, EDITED BY ME
expect-no-manifest: project claude .claude/rules/retired-rule.md
expect-output: changed since it was installed
