name: Update over an installed file that became a symlink reports it restored, in every installer
# The user moved two installed files into a dotfiles folder and linked them back: one still the
# package's current file, one an older copy the manifest recorded. Update never writes through a
# link: it puts the package's file in place of each link and leaves the files they point at alone.
# There was no installed file to refresh, so every installer reports both as restored (the wording
# install.sh and install.ps1 use), never as refreshed or as up to date.
seed-package: home:dotfiles/same.md = .claude/rules/security-qa.md
seed: home:dotfiles/older.md = AN OLDER COPY OF THE RULE
seed-dir: project:.claude/rules
seed-symlink: project:.claude/rules/security-qa.md -> home:dotfiles/same.md
seed-symlink: project:.claude/rules/test-tools.md -> home:dotfiles/older.md
seed-manifest: project claude .claude/rules/security-qa.md
seed-manifest: project claude .claude/rules/test-tools.md
run: update project claude
expect-exit: 0
expect-output: Restored .claude/rules/security-qa.md (was missing)
expect-output: Restored .claude/rules/test-tools.md (was missing)
expect-same-as-package: project:.claude/rules/security-qa.md = .claude/rules/security-qa.md
expect-same-as-package: project:.claude/rules/test-tools.md = .claude/rules/test-tools.md
expect-same-as-package: home:dotfiles/same.md = .claude/rules/security-qa.md
expect-content: home:dotfiles/older.md = AN OLDER COPY OF THE RULE
