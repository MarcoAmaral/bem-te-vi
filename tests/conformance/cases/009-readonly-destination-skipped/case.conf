name: A read-only destination is skipped on install and kept on uninstall
# Read-only is a deliberate signal not to touch the file. Not run as root: mode 444 does not stop
# root writing or deleting.
# Install: security-qa.md is read-only before the install, so it is skipped and the rest installs.
# Uninstall: files from every part of the tree are made read-only after the install, so they are
# kept (and still the package's own copy, which proves the install reached them) while the other
# tracked files go.
seed: project:.claude/rules/security-qa.md = MY READ-ONLY RULES
seed-readonly: project:.claude/rules/security-qa.md
run: install project claude
expect-exit: 0
seed-readonly: project:.claude/rules/testing-guidelines.md
seed-readonly: project:.claude/commands/qa.md
seed-readonly: project:.claude/skills/qa-plan/SKILL.md
seed-readonly: project:.claude/agents/qa-writer.md
seed-readonly: project:.claude/hooks/validate-tc-format.sh
run: uninstall project claude
expect-exit: 0
expect-content: project:.claude/rules/security-qa.md = MY READ-ONLY RULES
expect-no-backup: project:.claude/rules/security-qa.md
expect-same-as-package: project:.claude/rules/testing-guidelines.md = .claude/rules/testing-guidelines.md
expect-same-as-package: project:.claude/commands/qa.md = .claude/commands/qa.md
expect-same-as-package: project:.claude/skills/qa-plan/SKILL.md = .claude/skills/qa-plan/SKILL.md
expect-same-as-package: project:.claude/agents/qa-writer.md = .claude/agents/qa-writer.md
expect-same-as-package: project:.claude/hooks/validate-tc-format.sh = .claude/hooks/validate-tc-format.sh
expect-absent: project:.claude/rules/code-style-qa.md
expect-output: destination is read-only
