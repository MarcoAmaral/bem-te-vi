name: Uninstall removes an installed file whose only change is its line endings
# An editor set to CRLF rewrites qa.md's line endings after install. Only carriage returns differ
# from the bytes recorded in the manifest, so none of the user's content is in it: it is still the
# package's file, and uninstall removes it like any other unmodified file (plan 017, item 2).
run: install project claude
seed-crlf: project:.claude/commands/qa.md
run: uninstall project claude
expect-exit: 0
expect-absent: project:.claude/commands/qa.md
expect-no-manifest: project claude .claude/commands/qa.md
