name: Update keeps a read-only file the package stopped shipping, and drops its entry
# A read-only file is a deliberate signal not to touch it, on removal as on install, so update
# treats it the way uninstall does: kept and reported, even when it is still exactly as installed.
run: install project claude
seed: project:.claude/rules/retired-rule.md = RETIRED RULE
seed-manifest: project claude .claude/rules/retired-rule.md
seed-readonly: project:.claude/rules/retired-rule.md
run: update project claude
expect-exit: 0
expect-content: project:.claude/rules/retired-rule.md = RETIRED RULE
expect-no-manifest: project claude .claude/rules/retired-rule.md
expect-output: read-only
