name: A file destination that is a link to a folder is skipped as a directory; the rest installs
# Case 044's guarantee, for a link: .claude/commands/qa.md is a symlink to a folder of the user's,
# in the home folder (run.ps1 cannot link to a path under the project folder, whose name holds
# wildcard characters). It is a directory to whoever opens it, so nothing is written into it, it
# is not backed up or replaced, nothing is recorded for it, and the rest of the install goes on
# (plan 061 B2).
# install.sh did this; the CLI hashed the folder (EISDIR) and stopped part-way, and install.ps1
# took the link for a broken one and removed it.
seed: home:my-commands/mine.md = MY OWN NOTES
seed-dir: project:.claude/commands
seed-symlink: project:.claude/commands/qa.md -> home:my-commands
run: install project claude
expect-exit: 0
expect-content: home:my-commands/mine.md = MY OWN NOTES
expect-content: project:.claude/commands/qa.md/mine.md = MY OWN NOTES
expect-no-backup: project:.claude/commands/qa.md
expect-no-manifest: project claude .claude/commands/qa.md
expect-manifest: project claude .claude/commands/qa-cases.md
expect-manifest: project claude .claude/rules/security-qa.md
expect-manifest: project claude .claude/skills/qa-plan/SKILL.md
expect-output: is a directory
