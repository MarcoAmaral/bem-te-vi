name: Uninstall removes only unmodified files, and never a backup
run: install project claude
seed: project:.claude/rules/testing-guidelines.md = I EDITED THIS AFTER INSTALLING
seed: project:.claude/rules/security-qa.md.qa-skills-backup-20260101T000000Z = AN OLD BACKUP
run: uninstall project claude
expect-exit: 0
expect-content: project:.claude/rules/testing-guidelines.md = I EDITED THIS AFTER INSTALLING
expect-content: project:.claude/rules/security-qa.md.qa-skills-backup-20260101T000000Z = AN OLD BACKUP
expect-absent: project:.claude/commands/qa.md
expect-absent: project:.claude/rules/security-qa.md
expect-no-manifest: project claude .claude/commands/qa.md
# The package lets go of a file it keeps: the entry is dropped, so a later reinstall treats the
# edited file as the user's and backs it up rather than adopting it.
expect-no-manifest: project claude .claude/rules/testing-guidelines.md
