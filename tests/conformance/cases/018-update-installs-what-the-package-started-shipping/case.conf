name: Update installs a file the package started shipping after the install
# Dropping test-tools.md and its entry leaves an install that predates that rule. Update must
# install it, as it would any file, and record it (decided 2026-10-14, plan 033 item 3).
run: install project claude
drop-manifest: project claude .claude/rules/test-tools.md
run: update project claude
expect-exit: 0
expect-same-as-package: project:.claude/rules/test-tools.md = .claude/rules/test-tools.md
expect-manifest: project claude .claude/rules/test-tools.md
expect-output: Added
