name: Update of a home manifest that records the .clinerules an older install.ps1 left installs Cline globally
# install.ps1 up to 2.7.x wrote Cline's project file into the home folder on a global install and
# recorded it under cline. Cline now has global folders (plan 058), so update treats it as a global
# Cline install: the old file, unchanged, is removed as no longer shipped, and the rules and skills
# are installed in ~/.cline.
seed: home:.clinerules = OLD CLINE ADAPTER
seed-manifest: home cline .clinerules
run: update global cline
expect-exit: 0
expect-absent: home:.clinerules
expect-no-manifest: home cline .clinerules
expect-tree-as-package: home:.cline/rules = adapters/cline/rules
expect-tree-as-package: home:.cline/skills = adapters/skills
expect-manifest: home cline .cline/skills/qa/SKILL.md
expect-output: no longer shipped
